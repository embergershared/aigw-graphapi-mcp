# Dependabot proposes updates no sooner than 7 days after a release (cooldown), like the
# package age gate. Its PRs are exempt from the PR rules (no issue, dependabot/ branch).
# Uncomment the ecosystems the repository uses. Python dependencies are refreshed with
# scripts/lock_requirements.py instead (hash-locked, age-checked).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

