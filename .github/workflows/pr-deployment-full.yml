name: PR deployment (full)

# Deploys the full profile, with Bastion and the jumpboxes, into a throwaway
# environment for a pull request that carries the deploy-full label: when the
# label is added and on every later push. It is slow and costly, so it is
# opt-in and not meant to be a required check. Same steps and teardown as
# pr-deployment.yml; setup: docs/ci-deployment.md.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    # Keep in step with $CiInfrastructurePaths in scripts/ci-environments.ps1.
    paths:
      - "infra/**"
      - "scripts/**"
      - "azure.yaml"
      - ".github/workflows/pr-deployment.yml"
      - ".github/workflows/pr-deployment-full.yml"
      - ".github/workflows/deploy-environment.yml"

permissions:
  contents: read

jobs:
  full:
    name: Deploy
    if: >-
      vars.PR_DEPLOYMENT_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-full') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-full')
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      profile: full
    permissions:
      contents: read
      id-token: write
      pull-requests: write
