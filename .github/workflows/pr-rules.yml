# Checks a PR against the repository rules (.github/copilot-instructions.md):
#   - branch name <owner prefix>/<type>/<issue>-<slug> (no prefix from a fork), never squad/
#   - base branch: main (or <owner prefix>/main in a fork that keeps main as upstream)
#   - the body closes at least one issue
#   - no AI attribution (Co-Authored-By an AI tool, "Generated with ...") in commits or body
#   - commit message style (warnings only)
# Dependabot PRs are exempt.
name: PR rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: PR rules
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_BODY: ${{ github.event.pull_request.body }}
    # Every check runs and reports, even after another one failed.
    steps:
      - name: Branch name and base branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Projects made from this template live in both owners.
          case "$OWNER" in
            embergershared) prefix="emberger/" ;;
            g62priv) prefix="emm/" ;;
            *) prefix="" ;;
          esac
          # The owner prefix is for branches in this repository; a contributor's fork has none.
          branch_prefix="$prefix"
          [ "$HEAD_REPO" = "$REPO" ] || branch_prefix=""
          types="feature|fix|perf|docs|refactor|chore|test|ci|build"
          ok=true
          if [[ "$HEAD_REF" == squad/* ]]; then
            echo "::error::Branch '$HEAD_REF' starts with squad/: never use squad/ branches"
            ok=false
          elif [[ ! "$HEAD_REF" =~ ^${branch_prefix}(${types})/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$HEAD_REF' must be ${branch_prefix}<type>/<issue>-<kebab-case-slug>, type one of: ${types//|/, } (e.g. ${branch_prefix}feature/42-statement-extraction)"
            ok=false
          fi
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ] && [ "$BASE_REF" != "${prefix}main" ]; then
            echo "::error::The PR targets '$BASE_REF': PRs go to '$DEFAULT_BRANCH' (or ${prefix}main in a fork)"
            ok=false
          fi
          $ok

      - name: Linked issue
        if: ${{ !cancelled() }}
        run: |
          if ! grep -Eiq '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+' <<<"$PR_BODY"; then
            echo "::error::The PR body must close its issue: 'Closes #<issue>' (one keyword per issue: 'Closes #42, closes #43')"
            exit 1
          fi
          if grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+[[:space:]]*,[[:space:]]*#[0-9]+' <<<"$PR_BODY"; then
            echo "::warning::'Closes #42, #43' only closes #42: put a keyword before each issue"
          fi

      - name: No AI attribution
        if: ${{ !cancelled() }}
        run: |
          # Attribution lines start a line: a "Co-Authored-By:" trailer, or "Generated with ..."
          # (often after an emoji). A sentence that only mentions them is fine.
          ai='(claude|anthropic|copilot|openai|chatgpt|gpt-?[0-9]|gemini|cursor|codeium|devin|aider)'
          pattern="^[[:space:]]*(co-authored-by:.*${ai}|[^[:alnum:]]{0,8}generated (with|by) .*${ai})"
          gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | "\(.sha[0:7])\t\(.commit.message | @base64)"' > "$RUNNER_TEMP/commits.tsv"
          bad=false
          while IFS=$'\t' read -r sha message64; do
            if base64 -d <<<"$message64" | grep -Eiq "$pattern"; then
              echo "::error::Commit $sha credits an AI tool (Co-Authored-By or 'Generated with'): reword it without the attribution"
              bad=true
            fi
          done < "$RUNNER_TEMP/commits.tsv"
          if grep -Eiq "$pattern" <<<"$PR_BODY"; then
            echo "::error::The PR body credits an AI tool: remove the attribution line"
            bad=true
          fi
          ! $bad

      - name: Commit message style (warnings)
        if: ${{ !cancelled() }}
        run: |
          # Regexes in variables: bash can't parse ( ) written inline in [[ =~ ]].
          conventional='^[a-z]+(\([^)]*\))?!?: '
          follow_up='\(#[0-9]+\)\.$'
          while IFS=$'\t' read -r sha message64; do
            message=$(base64 -d <<<"$message64")
            subject=$(head -1 <<<"$message")
            [[ "$subject" == Merge* ]] && continue
            if [[ "$subject" != *. ]]; then
              echo "::warning::Commit $sha: the subject should be one sentence ending with a period: '$subject'"
            fi
            if [[ "$subject" =~ $conventional ]]; then
              echo "::warning::Commit $sha: no conventional-commit 'type:' prefix; start with the area or Added/Fixed"
            fi
            if ! grep -Eq '^Refs #[0-9]+' <<<"$message" && [[ ! "$subject" =~ $follow_up ]]; then
              echo "::warning::Commit $sha: add 'Refs #<issue>' after a blank line (or end a small follow-up's subject with '(#<issue>).')"
            fi
          done < "$RUNNER_TEMP/commits.tsv"
